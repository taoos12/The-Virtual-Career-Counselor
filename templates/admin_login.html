{% extends "base.html" %}

{% block title %}Admin Login - Virtual Career Counselor{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Admin Login</h2>
        <form id="adminLoginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login as Admin</button>
        </form>
        <div class="auth-links">
            <p>Not an admin? <a href="/login">User Login</a></p>
            <p><small>Default admin: username: admin, password: admin123</small></p>
        </div>
        <div id="message" class="message"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
        user_type: 'admin'
    };
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        });
        
        const result = await response.json();
        const messageDiv = document.getElementById('message');
        
        if (result.success) {
            messageDiv.className = 'message success';
            messageDiv.textContent = 'Admin login successful! Redirecting...';
            setTimeout(() => {
                window.location.href = result.redirect;
            }, 1000);
        } else {
            messageDiv.className = 'message error';
            messageDiv.textContent = result.message;
        }
    } catch (error) {
        document.getElementById('message').className = 'message error';
        document.getElementById('message').textContent = 'An error occurred. Please try again.';
    }
});
</script>
{% endblock %}
